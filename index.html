<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael's Wallet Day 3</title>
<style>
body{background:#0a0a0f;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px 0}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);padding:22px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 0 30px rgba(139,92,246,0.4)}
h2{text-align:center;color:#a78bfa;margin:5px 0}
.sub{text-align:center;font-size:11px;color:#888;margin-bottom:15px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#3b82f6);color:white;font-weight:bold;font-size:14px;margin-top:10px;cursor:pointer}
.btn2{background:#1f1f2a;border:1px solid #333}
.info{background:#111;padding:10px 12px;border-radius:10px;margin:8px 0;word-break:break-all;font-size:13px}
.label{color:#a78bfa;font-size:10px;font-weight:bold;letter-spacing:1px}
input{width:100%;padding:10px;background:#0f0f15;border:1px solid #333;border-radius:10px;color:white;margin-top:5px;box-sizing:border-box}
.divider{height:1px;background:#222;margin:15px 0}
.small{font-size:11px;color:#666;text-align:center;margin-top:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="card">
<h2>💜 Michael's Wallet</h2>
<div class="sub">Day 3 • Send ETH • PH → Web3</div>

<div class="info"><span class="label">ADDRESS</span><div id="address">Not Connected</div></div>
<div class="info"><span class="label">BALANCE</span><div id="balance">--</div></div>
<div class="info"><span class="label">NETWORK</span><div id="network">--</div></div>

<button class="btn" onclick="connect()">Connect MetaMask</button>
<button class="btn btn2" onclick="getBalance()">Refresh Balance</button>

<div class="divider"></div>

<div class="info" style="background:#0f0f15;border:1px dashed #333">
<span class="label">SEND ETH (Testnet Only!)</span>
<input id="to" placeholder="To Address 0x...">
<input id="amount" placeholder="Amount e.g. 0.001" style="margin-top:8px">
<button class="btn" style="background:linear-gradient(90deg,#ec4899,#8b5cf6)" onclick="sendETH()">Send ETH →</button>
<div id="tx" class="small"></div>
</div>

<p class="small">Built by Michael • Day 3 • Use Sepolia Testnet</p>
</div>

<script>
let provider, signer;
async function connect(){
 if(!window.ethereum){alert("Open in MetaMask browser!");return;}
 provider=new ethers.BrowserProvider(window.ethereum);
 await provider.send("eth_requestAccounts",[]);
 signer=await provider.getSigner();
 const addr=await signer.getAddress();
 document.getElementById("address").innerText=addr;
 const net=await provider.getNetwork();
 document.getElementById("network").innerText=net.name+" (Chain: "+net.chainId+")";
 if(net.chainId!=11155111n){
   document.getElementById("tx").innerHTML="⚠️ Switch to Sepolia Testnet for free ETH! Mainnet uses real money.";
 }
 getBalance();
}
async function getBalance(){
 if(!provider)return;
 try{
  const addr=document.getElementById("address").innerText;
  if(addr.includes("Not")){const s=await provider.getSigner();const a=await s.getAddress();document.getElementById("address").innerText=a;}
  const bal=await provider.getBalance(await signer.getAddress());
  document.getElementById("balance").innerText=ethers.formatEther(bal)+" ETH";
 }catch(e){console.log(e)}
}
async function sendETH(){
 try{
  const to=document.getElementById("to").value;
  const amt=document.getElementById("amount").value;
  if(!to||!amt){alert("Enter address and amount");return;}
  document.getElementById("tx").innerText="Sending... confirm in MetaMask...";
  const tx=await signer.sendTransaction({to:to,value:ethers.parseEther(amt)});
  document.getElementById("tx").innerHTML="Sent! Tx: "+tx.hash.slice(0,20)+"...<br>Waiting confirmation...";
  await tx.wait();
  document.getElementById("tx").innerHTML="✅ Confirmed!<br>"+tx.hash;
  getBalance();
 }catch(e){
  document.getElementById("tx").innerText="Error: "+e.message.slice(0,100);
 }
}
</script>
</body>
</html>
